<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#dc2626">
<title>Cardápio Digital</title>
<style>
:root{--cor:#dc2626;--cor-esc:#991b1b;--bg:#f6f6f7;--txt:#1f2937;--mut:#6b7280;--borda:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:96px}
.capa{background:linear-gradient(135deg,var(--cor),var(--cor-esc));color:#fff;text-align:center;padding:34px 18px 66px}
.logo{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.capa h1{margin:0;font-size:26px}
.capa p{margin:6px 0 0;opacity:.9}
.infos{width:calc(100% - 32px);max-width:528px;margin:-40px auto 0;background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;position:relative}
.infos small{display:block;color:var(--mut);font-size:12px}
.infos b{font-size:15px}
.status{grid-column:1/-1;padding:8px;border-radius:10px;font-weight:600;font-size:14px}
.status.on{background:#dcfce7;color:#166534}
.status.off{background:#fee2e2;color:#991b1b}
.busca{max-width:560px;margin:0 auto;padding:16px 16px 6px}
.busca input{width:100%;padding:13px 16px;border:1px solid var(--borda);border-radius:12px;font-size:16px;background:#fff}
.abas-wrap{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--borda);margin-top:8px}
.abas{max-width:560px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex:0 0 auto;border:1px solid var(--borda);background:#fff;color:var(--txt);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.aba.ativa{background:var(--cor);color:#fff;border-color:var(--cor)}
main{max-width:560px;margin:0 auto;padding:6px 16px}
main h2{font-size:20px;margin:22px 0 10px;scroll-margin-top:70px}
.item{display:flex;gap:12px;background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.item h3{margin:0 0 4px;font-size:16px}
.item p{margin:0 0 10px;color:var(--mut);font-size:13.5px;line-height:1.4}
.tag{align-self:flex-start;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-bottom:6px}
.rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rodape b{font-size:17px}
.foto{position:relative;width:96px;height:96px;flex:0 0 96px;border-radius:14px;background:linear-gradient(135deg,#fee2e2,#fecaca);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ctrl{display:inline-flex;align-items:center;gap:10px}
.ctrl button{border:0;cursor:pointer}
.ctrl .add{background:var(--cor);color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;font-size:14px}
.ctrl button:not(.add){width:32px;height:32px;border-radius:50%;background:var(--cor);color:#fff;font-size:18px;font-weight:700}
.ctrl span{min-width:16px;text-align:center;font-weight:700}
.bar{position:fixed;left:16px;right:16px;bottom:16px;max-width:528px;margin:0 auto;background:var(--cor);color:#fff;border:0;border-radius:14px;padding:16px 18px;display:none;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer}
.badge{background:#fff;color:var(--cor);border-radius:999px;padding:2px 10px;margin-right:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px}
.sheet h2{margin:0 0 8px}
.linha-sac{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda)}
.linha-sac .n{flex:1;font-size:15px}
.linha-sac small{color:var(--mut);display:block}
.tot{margin-top:10px}
.tot div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}
.tot .final{color:var(--txt);font-size:19px;font-weight:800;border-top:1px solid var(--borda);margin-top:6px;padding-top:10px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
.tipos button{padding:12px;border-radius:12px;border:2px solid var(--borda);background:#fff;font-weight:700;font-size:15px;cursor:pointer}
.tipos button.on{border-color:var(--cor);color:var(--cor);background:#fef2f2}
.sheet label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1px solid var(--borda);border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
.enviar{width:100%;margin-top:18px;background:#16a34a;color:#fff;border:0;padding:16px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer}
.voltar{width:100%;background:none;border:0;color:var(--mut);padding:12px;font-size:15px;cursor:pointer}
.vazio{text-align:center;color:var(--mut);padding:30px 0}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px 16px}
</style>
</head>
<body>

<header class="capa">
  <div class="logo" id="logo"></div>
  <h1 id="nome"></h1>
  <p id="slogan"></p>
</header>

<div class="infos">
  <div class="status" id="status"></div>
  <div><small>Entrega</small><b id="i-tempo"></b></div>
  <div><small>Taxa</small><b id="i-taxa"></b></div>
  <div><small>Mínimo</small><b id="i-min"></b></div>
</div>

<div class="busca"><input id="busca" type="search" placeholder="🔍 Buscar no cardápio" oninput="desenhar(this.value)"></div>
<div class="abas-wrap"><nav class="abas" id="abas"></nav></div>
<main id="cardapio"></main>
<footer id="rodape"></footer>

<button class="bar" id="bar" onclick="abrirSacola()"></button>

<div class="ov" id="ov">
  <div class="sheet">
    <h2>🛒 Sua sacola</h2>
    <div id="lista-sac"></div>
    <div class="tot" id="tot"></div>

    <div class="tipos">
      <button id="t-entrega" class="on" onclick="setTipo('entrega')">🛵 Entrega</button>
      <button id="t-retirada" onclick="setTipo('retirada')">🏪 Retirada</button>
    </div>

    <label>Seu nome</label>
    <input id="f-nome" placeholder="Como podemos te chamar?">

    <div id="box-end">
      <label>Endereço de entrega</label>
      <input id="f-end" placeholder="Rua, número, bairro e referência">
    </div>

    <label>Forma de pagamento</label>
    <select id="f-pag" onchange="document.getElementById('box-troco').style.display=this.value==='Dinheiro'?'block':'none'">
      <option>Pix</option>
      <option>Cartão na entrega</option>
      <option>Dinheiro</option>
    </select>

    <div id="box-troco" style="display:none">
      <label>Troco para quanto? (opcional)</label>
